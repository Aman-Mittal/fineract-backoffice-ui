version: '3.8'

services:
  fineract-db:
    image: mariadb:10.6
    container_name: fineract-db
    ports:
      - '3306:3306'
    environment:
      - MYSQL_ROOT_PASSWORD=mysql
      - MYSQL_DATABASE=fineract_tenants
    volumes:
      - fineract-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pmysql"]
      interval: 5s
      timeout: 5s
      retries: 15

  fineract-backend:
    image: apache/fineract:latest
    container_name: fineract-backend
    depends_on:
      fineract-db:
        condition: service_healthy
    ports:
      - '8443:8443'
    environment:
      - FINERACT_HIKARI_JDBC_URL=jdbc:mysql://fineract-db:3306/fineract_tenants?autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
      - FINERACT_HIKARI_USERNAME=root
      - FINERACT_HIKARI_PASSWORD=mysql
      - FINERACT_DEFAULT_TENANTDB_HOSTNAME=fineract-db
      - FINERACT_DEFAULT_TENANTDB_PORT=3306
      - FINERACT_DEFAULT_TENANTDB_UID=root
      - FINERACT_DEFAULT_TENANTDB_PWD=mysql
      - FINERACT_DEFAULT_TENANTDB_NAME=fineract_tenants
      - FINERACT_NODE_ID=1
      - FINERACT_REMOTE_JOB_MESSAGE_HANDLER_SPRING_EVENTS_ENABLED=true

volumes:
  fineract-db-data:
