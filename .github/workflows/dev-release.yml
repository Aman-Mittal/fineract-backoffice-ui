name: Dev Release CI

on:
  push:
    branches:
      - dev-release
  workflow_dispatch:

# Granted per job rather than here, matching ci.yml and e2e.yml: this workflow holds
# `contents: write` to push the built site, and that is not something every future job added
# here should inherit by default.
permissions: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write # peaceiris/actions-gh-pages force-pushes the built site to gh-pages
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here uses the checkout token: the deploy step authenticates with
          # `github_token` of its own. Leaving credentials persisted in .git/config would put
          # them in reach of every later step and, worse, of the build output this job uploads.
          persist-credentials: false

      # No dependency cache, and `package-manager-cache: false` rather than merely omitting
      # `cache:` — the two are not the same thing on v7.
      #
      # This workflow publishes: it pushes the built application to gh-pages, where it is served
      # to real browsers. A GitHub Actions cache is writable from any branch, so restoring one on
      # a publishing path lets content authored in a lower-privilege context reach what gets
      # served — zizmor's `cache-poisoning`, and the same reasoning that keeps a `tags:` trigger
      # out of ci.yml.
      #
      # `setup-node` v7 added `package-manager-cache`, which defaults to *true* and caches
      # automatically whenever package.json declares `packageManager` or `devEngines`. This
      # repository declares neither today, so dropping `cache: 'npm'` alone happens to be
      # enough — and would silently stop being enough the day someone adds a `packageManager`
      # field, which is an ordinary thing to do. Turning it off explicitly is what makes the
      # guarantee hold. The cost is one uncached `npm ci` on a branch that publishes rarely.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test -- --watch=false --browsers=ChromeHeadless

      - name: Build
        run: npm run build -- --configuration production --base-href /fineract-backoffice-ui/

      # The demo is a static site on GitHub Pages, so it has no backend of its own. The
      # committed public/config.json ships a relative "/api/v1", which resolves against
      # github.io and cannot work here — every request would 404 against Pages itself.
      #
      # Point it at the community Fineract sandbox instead. That host returns
      # Access-Control-Allow-Origin for this Pages origin and permits the authorization,
      # content-type and fineract-platform-tenantid headers the application sends, so the
      # browser will accept the cross-origin responses.
      #
      # This is written here rather than committed to public/config.json so the demo endpoint
      # does not become a permanent divergence that conflicts on every merge from main.
      - name: Point the demo at the community Fineract sandbox
        run: |
          # allowedApiOrigins entries are offered to the user as selectable endpoints on the
          # login screen, not just used for allow-listing. So each one must be a complete API
          # base URL: a bare origin would appear in the dropdown as a legitimate-looking choice
          # and then send requests to <origin>/authentication, with no /fineract-provider/api/v1
          # path — which the server answers 405 and without CORS headers.
          #
          # A full URL still allow-lists correctly, because isOriginAllowed() compares
          # new URL(allowed).origin and so ignores the path.
          cat > dist/fineract-backoffice-ui/browser/config.json <<'JSON'
          {
            "fineractApiUrl": "https://sandbox.mifos.community/fineract-provider/api/v1",
            "defaultTenant": "default",
            "rbacEnabled": true,
            "institutionType": "universal",
            "allowedApiOrigins": ["https://sandbox.mifos.community/fineract-provider/api/v1"]
          }
          JSON
          cat dist/fineract-backoffice-ui/browser/config.json

      - name: Copy index.html to 404.html for GitHub Pages routing fallback
        run: cp dist/fineract-backoffice-ui/browser/index.html dist/fineract-backoffice-ui/browser/404.html

      - name: Upload Build Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dev-release-build
          path: dist/fineract-backoffice-ui/browser

      - name: Deploy to GitHub Pages
        # Pinned to the *commit* v4.0.0 points at. `peaceiris` publishes annotated tags, so
        # `git ls-remote` reports the tag object's SHA (47f197a2…) rather than the commit's;
        # pinning that would not resolve to anything Actions can check out.
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/fineract-backoffice-ui/browser
          force_orphan: true
