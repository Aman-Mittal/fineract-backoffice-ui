name: E2E Tests

on:
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Generate Local SSL Certificates for Dev Server
        run: |
          mkdir -p ssl
          openssl req -new -x509 -keyout ssl/localhost.key -out ssl/localhost.crt -days 365 -nodes -subj "/CN=localhost"

      - name: Start PostgreSQL Database
        run: |
          docker compose -f deploy/docker-compose-e2e.yml up -d fineract-db

      - name: Wait for Database and Initialize Fineract Databases
        run: |
          echo "Waiting for PostgreSQL to be healthy..."
          for i in {1..30}; do
            if docker exec fineract-db pg_isready -U postgres >/dev/null 2>&1; then
              echo "✅ PostgreSQL is ready!"
              break
            fi
            echo "Waiting for postgres... ($i/30)"
            sleep 3
          done
          echo "Initializing Fineract tenants and default databases..."
          docker exec -i fineract-db psql -U postgres -c "CREATE DATABASE fineract_tenants;" -c "CREATE DATABASE fineract_default;"

      - name: Start Apache Fineract Backend
        run: |
          docker compose -f deploy/docker-compose-e2e.yml up -d fineract-backend

      - name: Wait for Fineract to be ready
        run: |
          echo "Waiting for Fineract backend instance to start up (Migrations can take 60-90s)..."
          for i in {1..30}; do
            # Fineract exposes actuator/info which returns 200 OK once Spring Boot has initialized
            HTTP_STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" https://localhost:8443/fineract-provider/actuator/info || true)
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ Fineract is up and running!"
              exit 0
            fi
            echo "Waiting for backend... (status: $HTTP_STATUS) ($i/30)"
            sleep 10
          done
          echo "❌ Fineract failed to start in time. Printing logs:"
          docker compose -f deploy/docker-compose-e2e.yml logs fineract-backend
          exit 1

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run E2E Tests
        env:
          FINERACT_SERVER_URL: 'https://localhost:8443/fineract-provider/api/v1'
          FINERACT_TENANT_ID: 'default'
          FINERACT_USERNAME: 'mifos'
          FINERACT_PASSWORD: 'password'
        run: npx playwright test --video=on

      - name: Upload E2E Test Report & Videos
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Comment PR with Report Link
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        if: always() && github.event_name == 'pull_request'
        with:
          script: |
            const runId = context.runId;
            const repo = context.repo;
            const prNumber = context.payload.pull_request.number;
            
            const commentBody = `### 🎭 Playwright E2E Test Report
            
            The Playwright E2E test suite has finished. You can download the full HTML test report along with recorded runs/videos from the workflow artifacts:
            
            🔗 [Download Playwright E2E Report & Videos](https://github.com/${repo.owner}/${repo.repo}/actions/runs/${runId})`;
            
            const { data: comments } = await github.rest.issues.listComments({
              owner: repo.owner,
              repo: repo.repo,
              issue_number: prNumber,
            });
            const botComment = comments.find(comment => comment.body.includes('### 🎭 Playwright E2E Test Report'));
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: repo.owner,
                repo: repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: repo.owner,
                repo: repo.repo,
                issue_number: prNumber,
                body: commentBody
              });
            }
