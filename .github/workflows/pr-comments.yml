name: PR Comments

# Publishes the comment bodies that CI and the E2E suite rendered, onto the pull request they
# belong to — the E2E summaries, and the sequence diagram of what the change talks to.
#
# This exists because a `pull_request` run from a fork gets a read-only GITHUB_TOKEN — the run
# executes the contributor's code, so GitHub does not let it write here. That left outside
# contributors, the people least able to interpret a raw run, with no comment at all.
#
# `workflow_run` fires after that run finishes and executes the copy of this file on the
# **default branch**, with a token this repository controls. Two consequences worth knowing:
#
#   - Changes to this workflow do not take effect until they are merged. A pull request that
#     edits this file cannot test it; the first real exercise is the first run after merge.
#   - Nothing here may check out or execute the pull request's code. That combination —
#     writable token plus untrusted code — is the "pwn request" vulnerability. The checkout
#     below is deliberately ref-less, which gives the base repository's default branch, and
#     the only thing run is a script from it.
#
# The downloaded summary is untrusted input: it was rendered by a run of the contributor's
# branch, which can modify `scripts/e2e-summary.mjs` freely. It is read as data, never
# evaluated and never interpolated into a `run:` block, and the target pull request is
# resolved from the event rather than from anything in the artifact. See
# .github/scripts/post-e2e-comments.js for the rest of the reasoning.

on:
  # zizmor: ignore[dangerous-triggers] — the point of this workflow, and safe here: no
  # checkout of the pull request's code, and the artifact is treated as untrusted data.
  workflow_run:
    workflows: ['CI', 'E2E Tests']
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  comment:
    name: Publish the rendered comments
    # Only runs that came from a pull request have one to comment on. A push to a branch with
    # no open pull request is filtered again inside the script, which is where the check that
    # matters lives.
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout of this repository's default branch
      actions: read # list and download the triggering run's artifacts
      pull-requests: write # the comment itself
    steps:
      # No `ref:`. This resolves to the default branch of *this* repository, never the pull
      # request's head — which is the whole reason this job may hold a writable token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Download the rendered summaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: pr-comment-*
          path: summaries
          # Each artifact keeps its own directory, so the script can tell one body from another
          # by name — which is what binds a body to the marker it is allowed to post under. A run
          # that produced only some of them — CI renders the diagram, E2E the summaries — simply
          # has fewer directories, and the script skips what is absent.
          merge-multiple: false

      - name: Post or update the comments
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const post = require('./.github/scripts/post-e2e-comments.js');
            await post({ github, context, core });
